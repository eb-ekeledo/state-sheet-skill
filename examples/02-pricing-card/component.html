<!-- Seeded bugs: hard-coded grey text that disappears in dark mode, huge prices spill out, long plan names cut off at one line. -->
<style>
  .card { font-family: Inter, system-ui, sans-serif; background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); color: #111; max-width: 300px; }
  [data-theme="dark"] .card { background: #1C1C1C; box-shadow: 0 0 0 1px rgba(255,255,255,.06); color: #F2F2F0; }
  .plan { margin: 0 0 4px; font-size: 13px; line-height: 18px; height: 18px; overflow: hidden; font-weight: 550; color: #555; }
  .price { margin: 0 0 14px; font-size: 32px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; width: 160px; }
  .price small { font-size: 13px; font-weight: 450; color: #555; letter-spacing: 0; }
  ul { list-style: none; margin: 0 0 16px; padding: 0; font-size: 13px; line-height: 1.6; }
  li::before { content: '✓  '; }
  button { font: 600 13px/1 Inter, system-ui, sans-serif; width: 100%; height: 38px; border: 0; border-radius: 10px; background: #151515; color: #fff; }
  button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  [data-theme="dark"] button { background: #F2F2F0; color: #111; }
</style>
<script>
  window.renderComponent = function (p) {
    return '<div class="card"><p class="plan">' + p.plan + '</p><p class="price">' + p.price + ' <small>/ month</small></p>' +
      '<ul>' + p.features.map(function (f) { return '<li>' + f + '</li>'; }).join('') + '</ul><button>Choose ' + p.plan.split(' ')[0] + '</button></div>';
  };
</script>
